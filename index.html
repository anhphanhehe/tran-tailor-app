<style>
:root{--brand:#032f6c;--bg:#f3f5f9;--card:#fff;--ink:#032f6c;--mute:#5f6f8c;--line:#d6dce8;--tape:#cfd7e4;--mark:#c8372d;--ok:#1d7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a3a;--card:#0c2550;--ink:#eef2f8;--mute:#a3b1c9;--line:#23406f;--tape:#b9c4d6;--mark:#ef6a5e;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#071a3a;--card:#0c2550;--ink:#eef2f8;--mute:#a3b1c9;--line:#23406f;--tape:#b9c4d6;--mark:#ef6a5e;--ok:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.brandbar{position:relative;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 22px;text-align:center}
.brandbar img{width:96px;height:96px;display:block;margin:0 auto 6px}
.brandbar b{display:block;font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase}
.brandbar small{color:#b9c4d6;letter-spacing:.08em}
.langsw{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:4px}
.langsw button{font:inherit;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:6px;cursor:pointer}
.langsw button.on{background:#fff;color:var(--brand);border-color:#fff}
h1{font-size:1.5rem;margin:8px 0 4px}
h2{font-size:1.2rem;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--mute)}
.tape{position:relative;height:30px;margin:18px 0 22px;border-radius:4px;background:var(--tape);
background-image:repeating-linear-gradient(90deg,#032f6c 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,#032f6c 0 2px,transparent 2px 50px);
background-size:100% 40%,100% 70%;background-repeat:no-repeat;background-position:0 0,0 0;overflow:hidden}
.tape i{position:absolute;top:0;bottom:0;width:3px;background:var(--mark);left:0;transition:left .35s}
.tape span{position:absolute;bottom:2px;font-size:.7rem;font-weight:700;color:#032f6c;transform:translateX(-50%)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-weight:500;margin-bottom:4px}
.hint{font-size:.85rem;color:var(--mute);margin:0 0 6px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.f{margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer}
.pick input{margin-top:5px;accent-color:var(--brand)}
.pick b{display:block}
.pick small{color:var(--mute)}
.pick.on{border-color:var(--ink);background:var(--bg)}
.m{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.m svg{width:72px;height:auto;display:block}.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:8px;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);margin-top:10px}.btn.alt{background:transparent;color:var(--ink)}
.m:last-of-type{border:0}
.m .in{display:flex;align-items:center;gap:8px;max-width:180px}
.m .in span{color:var(--mute)}
.warn{color:var(--mark);font-size:.82rem;min-height:1.2em;margin-top:4px}
.tip{background:var(--bg);border-left:4px solid var(--tape);padding:10px 12px;border-radius:4px;font-size:.9rem;margin-bottom:14px}
.grp{margin:22px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--line);color:var(--brand);font-size:1rem}
.grp:first-of-type{margin-top:6px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
button{font:inherit;font-weight:700;border-radius:8px;padding:12px 18px;border:1px solid var(--ink);cursor:pointer;background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink)}
.err{color:var(--mark);font-size:.9rem;margin-top:10px;min-height:1.2em}
table{width:100%;border-collapse:collapse;margin:8px 0}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.toast{color:var(--ok);font-weight:500;margin-top:10px;min-height:1.2em}
.qr{display:flex;gap:16px;align-items:center;margin-top:18px;padding:16px;border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;background:var(--card)}.qr img{width:148px;height:148px;flex:none;background:#fff;padding:8px;border-radius:8px;border:1px solid #d6dce8}.qr ol{margin:6px 0 0;padding-left:18px;font-size:.9rem}.qr a{color:var(--ink);font-weight:700}
@media (max-width:420px){.qr{flex-direction:column;text-align:center}.qr ol{text-align:left}}.qr b{display:block}.qr small{color:var(--mute)}
.zov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,20,48,.72)}.zov[hidden]{display:none}
.zbox{background:#fff;color:#032f6c;border-radius:14px;padding:20px;max-width:340px;width:100%;text-align:center;border-top:6px solid #032f6c}.zbox img{width:100%;max-width:260px;height:auto;display:block;margin:10px auto}.zbox p{margin:0 0 8px;font-size:.92rem}.zbox .btn{background:#032f6c;color:#fff;border-color:#032f6c}.zbox .btn.alt{background:transparent;color:#032f6c}
@media print{.tape,.nav,.tip,.qr,.zov,.noprint,h1,.langsw{display:none}.card{border:0;padding:0}.brandbar{background:#fff;color:#000}body{background:#fff;color:#000}}
</style>

fields().forEach(function(f){var val=S.vals[f];h+='<tr><td>'+F[f].label[LANG]+'</td><td>'+(val?esc(val)+' cm':'<span class="sub">'+t.notmeasured+'</span>')+'</td></tr>'});
h+='</table><p class="sub">'+t.order(S.picks.map(function(k){return G[k].label[LANG]}).join(", "))+'</p>'+
(S.note?'<p class="sub"><b>'+t.note_label+':</b> '+esc(S.note)+'</p>':'')+
'<div class="noprint"><h2>'+t.sendto(esc(SHOP.name))+'</h2><p class="sub">'+t.sendsub+'</p>'+qr()+send()+'<div class="nav"><button class="ghost" id="back">'+t.btn_backedit+'</button><button class="ghost" id="copy">'+t.btn_copy+'</button></div>'+
'<div class="nav"><button class="ghost" id="print">'+t.btn_print+'</button><button class="ghost" id="reset">'+t.btn_reset+'</button></div><div class="toast" id="toast"></div></div>';
}
v.innerHTML=h;bind()}
function send(){var t=TXT[LANG],e=encodeURIComponent(summary()),d=SHOP.phone.replace(/\D/g,""),h='<a class="btn" id="ship" target="_blank" rel="noopener" href="'+SHOP.fb+'">'+t.btn_shipdirect+'</a>';
if(d){h+='<button type="button" id="zalo" style="width:100%;margin-top:10px">'+t.btn_zalo+'</button><a class="btn alt" href="sms:'+d+'?&body='+e+'">'+t.btn_sms+'</a>'}
if(SHOP.email)h+='<a class="btn alt" href="mailto:'+SHOP.email+'?subject='+encodeURIComponent(TXT[LANG].mail_subject(S.name))+'&body='+e+'">'+t.btn_email+'</a>';return h}
function summary(){var t=TXT[LANG],s="";s+=t.summary_title+"\n"+t.summary_customer+": "+S.name+"\n"+t.summary_phone+": "+S.phone+"\n"+t.summary_height+": "+S.height+" cm\n"+t.summary_weight+": "+S.weight+" kg\n"+t.summary_order+": "+S.picks.map(function(k){return G[k].label[LANG]}).join(", ")+"\n";
fields().forEach(function(f){if(S.vals[f])s+=F[f].label[LANG]+": "+S.vals[f]+" cm\n"});
if(S.note)s+=t.note_label+": "+S.note+"\n";
return s}
function go(n){S.step=n;save();render();window.scrollTo(0,0)}
function bind(){var t=TXT[LANG],nx=$("next"),bk=$("back"),er=$("err");
if(bk)bk.onclick=function(){go(S.step-1)};
if(S.step==0){nx.onclick=function(){
S.name=$("name").value.trim();S.phone=$("phone").value.trim();S.height=$("height").value;S.weight=$("weight").value;
var h=num(S.height),w=num(S.weight);
if(!S.name)return er.textContent=t.err_name;
if(!/^[0-9+\s.]{9,14}$/.test(S.phone))return er.textContent=t.err_phone;
if(h===null||h<120||h>220)return er.textContent=t.err_height;
if(w===null||w<30||w>200)return er.textContent=t.err_weight;
go(1)}}
if(S.step==1){document.querySelectorAll("[data-k]").forEach(function(c){c.onchange=function(){
var k=c.dataset.k,i=S.picks.indexOf(k);if(c.checked&&i<0)S.picks.push(k);if(!c.checked&&i>-1)S.picks.splice(i,1);
c.closest(".pick").classList.toggle("on",c.checked);save()}});
nx.onclick=function(){if(!S.picks.length)return er.textContent=t.err_picks;go(2)}}
if(S.step==2){document.querySelectorAll("[data-f]").forEach(function(i){i.oninput=function(){
var f=i.dataset.f,n=num(i.value),w=$("w_"+f);S.vals[f]=i.value;save();
w.textContent=(n!==null&&NOLIMIT.indexOf(f)<0&&(n<F[f].min||n>F[f].max))?t.warn_range(F[f].min,F[f].max):""}});
var noteEl=$("note");if(noteEl)noteEl.oninput=function(){S.note=noteEl.value;save()};
nx.onclick=function(){
var bad=fields().filter(function(f){var n=num(S.vals[f]);return n!==null&&NOLIMIT.indexOf(f)<0&&(n<F[f].min||n>F[f].max)});
if(bad.length&&!S.ok){S.ok=1;er.textContent=t.err_badrange(bad.map(function(f){return F[f].label[LANG]}).join(", "));return}
S.ok=0;fields().forEach(function(f){var n=num(S.vals[f]);S.vals[f]=n===null?"":String(n)});go(3)}}
if(S.step==3){$("copy").onclick=function(){var s=summary(),msg=$("toast");
function done(ok){msg.textContent=ok?t.copy_ok:t.copy_fail}
try{navigator.clipboard.writeText(s).then(function(){done(1)},function(){done(0)})}catch(e){done(0)}};
$("ship").onclick=function(){
var body=new URLSearchParams({"form-name":"so-do","name":S.name,"phone":S.phone,"height":S.height,"weight":S.weight,"garments":S.picks.map(function(k){return G[k].label[LANG]}).join(", "),"note":S.note,"measurements":summary()}).toString();
fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).catch(function(){})};
var z=$("zalo");if(z)z.onclick=function(){zalo()};
$("print").onclick=function(){try{window.print()}catch(e){}};
$("reset").onclick=function(){S={step:0,name:"",phone:"",height:"",weight:"",picks:[],vals:{},note:""};save();render()}}}
document.querySelectorAll("#langsw button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
render();
</script>
